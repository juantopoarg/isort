<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1FA85A" id="metaTheme">
<title>I-Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1FA85A;
    --accent:#188347;
    --accent-dark:#12663A;
    --ink:#2B2A33;
    --ink-soft:#6B6878;
    --sun:#FFD43B;
    --sun-dark:#D9A800;
    --pink:#FF5FA2;
    --pink-dark:#D63D80;
    --violet:#7C4DFF;
    --violet-dark:#5A33CC;
    --ok:#22C55E;
    --bad:#FF4D5E;
    --chunk:rgba(0,0,0,.2);
    --display:'Baloo 2','Fredoka','Trebuchet MS',system-ui,sans-serif;
    --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    font-weight:700;
    color:#fff;
    background-color:var(--bg);
    background-image:radial-gradient(rgba(255,255,255,.14) 2px, transparent 2.6px);
    background-size:28px 28px;
    transition:background-color .4s ease;
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:560px;
    margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .hidden{display:none !important;}

  /* ---------- Barra superior ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;}
  .icon-btn{
    width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
    background:rgba(255,255,255,.22);color:#fff;font-size:22px;font-weight:800;
    border-bottom:4px solid var(--chunk);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{transform:translateY(3px);border-bottom-width:1px;}
  .right{display:flex;align-items:center;gap:8px;}
  .icon-btn.off{opacity:.7;}
  .lang{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:4px;gap:2px;}
  .lang button{
    font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;
    border:none;background:transparent;color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;min-height:34px;
  }
  .lang button.on{background:#fff;color:var(--ink);}

  /* ---------- Pantallas ---------- */
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .logo{
    font-family:var(--display);font-weight:800;text-align:center;text-transform:uppercase;
    font-size:clamp(54px,18vw,84px);line-height:.95;letter-spacing:.02em;margin:8px 0 0;
    text-shadow:0 5px 0 rgba(0,0,0,.28);
  }
  .logo em{font-style:normal;color:var(--sun);display:inline-block;transform:rotate(-3deg);}
  .tagline{text-align:center;font-size:17px;margin:6px 0 18px;text-shadow:0 2px 0 rgba(0,0,0,.2);}

  .panel{
    background:#fff;color:var(--ink);border-radius:22px;padding:16px;
    border-bottom:6px solid var(--chunk);
  }
  .panel h2{
    font-family:var(--display);font-weight:800;font-size:19px;margin:2px 0 10px;color:var(--ink);
  }
  .panel h2:not(:first-child){margin-top:18px;}

  .scope-list{display:flex;flex-direction:column;gap:10px;}
  .scope-btn{
    display:flex;align-items:center;gap:12px;text-align:left;width:100%;
    background:#F4F3F8;color:var(--ink);border:3px solid transparent;border-bottom:5px solid #D9D7E3;
    border-radius:16px;padding:10px 12px;cursor:pointer;font-family:var(--body);font-weight:800;
  }
  .scope-btn .ico{font-size:30px;line-height:1;}
  .scope-btn .nm{font-family:var(--display);font-size:20px;font-weight:800;display:block;line-height:1.1;}
  .scope-btn .sub{font-size:13px;color:var(--ink-soft);display:block;font-weight:700;}
  .scope-btn .txt{flex:1;min-width:0;}
  .scope-btn .cnt{font-family:var(--display);font-size:15px;background:#fff;border-radius:999px;padding:3px 10px;color:var(--ink-soft);white-space:nowrap;}
  .scope-btn.on{background:#E8FFF0;border-color:var(--ok);border-bottom-color:#16A34A;}
  .scope-btn[data-scope="local"].on{background:#FFF1E6;border-color:#FF7A2F;border-bottom-color:#D95F14;}
  .scope-btn[data-scope="all"].on{background:#F1EBFF;border-color:var(--violet);border-bottom-color:var(--violet-dark);}
  .scope-btn:active{transform:translateY(2px);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:var(--display);font-weight:800;font-size:18px;min-width:64px;min-height:44px;padding:6px 16px;
    border-radius:999px;border:3px solid transparent;border-bottom:5px solid #D9D7E3;background:#F4F3F8;color:var(--ink);cursor:pointer;
  }
  .chip.on{background:var(--sun);border-color:var(--sun-dark);color:var(--ink);}

  .btn{
    font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase;
    width:100%;min-height:54px;padding:10px 18px;border-radius:18px;border:none;cursor:pointer;color:#fff;
    border-bottom:6px solid var(--chunk);
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(4px);border-bottom-width:2px;}
  .btn:focus-visible,.chip:focus-visible,.scope-btn:focus-visible,.icon-btn:focus-visible,.lang button:focus-visible{outline:4px solid #fff;outline-offset:2px;}
  .btn.play{background:var(--pink);border-bottom-color:var(--pink-dark);font-size:28px;min-height:66px;margin-top:16px;}
  .btn.ghost{background:rgba(255,255,255,.22);margin-top:12px;}
  .btn.go{background:var(--sun);color:var(--ink);border-bottom-color:var(--sun-dark);}
  .btn.peek{background:var(--violet);border-bottom-color:var(--violet-dark);font-size:17px;text-transform:none;margin-bottom:10px;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  .btn.peek.holding{background:#5A33CC;transform:translateY(4px);border-bottom-width:2px;}
  .btn:disabled{opacity:.5;}
  .foot{text-align:center;font-size:13px;opacity:.85;margin-top:auto;padding-top:18px;}

  /* ---------- Catálogo ---------- */
  .screen-title{font-family:var(--display);font-weight:800;font-size:30px;text-align:center;margin:6px 0 10px;text-shadow:0 3px 0 rgba(0,0,0,.22);}
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.2);padding:5px;border-radius:999px;margin-bottom:14px;}
  .tabs button{
    flex:1;font-family:var(--display);font-weight:800;font-size:15px;border:none;border-radius:999px;background:transparent;color:#fff;
    padding:8px 4px;cursor:pointer;min-height:40px;
  }
  .tabs button.on{background:#fff;color:var(--ink);}
  .sec-head{font-family:var(--display);font-weight:800;font-size:20px;margin:14px 2px 8px;text-shadow:0 2px 0 rgba(0,0,0,.2);}
  .cat-row{
    display:flex;align-items:stretch;width:100%;text-align:left;background:#fff;color:var(--ink);border:none;
    border-bottom:5px solid var(--chunk);border-radius:16px;margin-bottom:10px;cursor:pointer;padding:0;overflow:hidden;
    font-family:var(--body);font-weight:700;
  }
  .cat-row:active{transform:translateY(3px);border-bottom-width:2px;}
  .cat-row .bar{width:46px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
  .cat-row .body{padding:9px 12px;min-width:0;flex:1;}
  .cat-row .meta{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .cat-row .qq{font-size:15px;line-height:1.25;margin-top:2px;}

  /* ---------- Juego ---------- */
  .hud{display:flex;align-items:center;gap:10px;margin:10px 0 12px;font-family:var(--display);font-weight:800;font-size:16px;}
  .track{flex:1;height:12px;background:rgba(0,0,0,.25);border-radius:999px;overflow:hidden;}
  .track i{display:block;height:100%;width:0;background:var(--sun);border-radius:999px;transition:width .4s ease;}
  .score{background:#fff;color:var(--ink);border-radius:999px;padding:3px 12px;white-space:nowrap;}

  .qcard{
    background:#fff;color:var(--ink);border-radius:22px;padding:14px 16px 16px;border-bottom:6px solid var(--chunk);
    position:relative;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .tag{
    font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap;
  }
  .tag.scope-global{background:#3D7BFF;}
  .tag.scope-local{background:#FF7A2F;}
  .tag.cat{background:var(--accent);}
  .tag.diff{background:#EEECF4;color:var(--ink-soft);}
  .q{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2;margin:0;}
  .dir{
    display:inline-block;margin:10px 0 0;font-size:13px;font-weight:800;background:#FFF3BF;color:#6B5200;
    padding:5px 10px;border-radius:10px;
  }
  .note{font-size:12px;color:var(--ink-soft);margin:8px 0 0;font-weight:700;}

  #cardList{list-style:none;margin:16px 0 0;padding:0;position:relative;}
  .item-card{
    position:relative;display:flex;align-items:center;gap:12px;height:76px;margin-bottom:10px;padding:0 12px;
    background:#fff;color:var(--ink);border-radius:18px;border-bottom:5px solid var(--chunk);
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;will-change:transform;
  }
  .item-card:last-child{margin-bottom:0;}
  .item-card.dragging{cursor:grabbing;z-index:30;box-shadow:0 14px 26px rgba(0,0,0,.3);transform-origin:center;transition:none !important;}
  .item-card.settling{transition:transform .18s ease;}
  .item-card.locked{cursor:default;touch-action:auto;transition:transform .4s cubic-bezier(.3,1.35,.5,1);}
  .item-card .rank{
    flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
    font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;
  }
  .item-card .txt{flex:1;min-width:0;pointer-events:none;}
  .item-card .nombre{
    font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .item-card .valor{font-size:13px;font-weight:800;color:var(--ink-soft);margin-top:3px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-card .grip{flex:none;color:#C9C6D6;font-size:20px;letter-spacing:-2px;pointer-events:none;}
  .item-card .mark{
    flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;
  }
  .item-card.correct{background:#E3FAEA;border-bottom-color:#16A34A;}
  .item-card.correct .rank{background:var(--ok);}
  .item-card.correct .mark{background:var(--ok);}
  .item-card.incorrect{background:#FFE5E8;border-bottom-color:#E11D48;animation:shake .4s ease;}
  .item-card.incorrect .rank{background:var(--bad);}
  .item-card.incorrect .mark{background:var(--bad);}
  .item-card.peeking{background:#FFF7CC;border-bottom-color:var(--sun-dark);box-shadow:0 0 0 3px var(--sun);}
  .item-card.peeking .rank{background:var(--violet);}
  .item-card.peeking .mark{visibility:hidden;}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .banner{
    margin-top:14px;text-align:center;font-family:var(--display);font-weight:800;font-size:19px;min-height:28px;
    text-shadow:0 2px 0 rgba(0,0,0,.22);
  }
  .banner b{font-size:26px;color:var(--sun);}
  .dock{
    position:sticky;bottom:0;margin-top:auto;padding:14px 0 calc(4px + env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, transparent, var(--bg) 28%);
  }
  .dock .row{display:flex;gap:10px;}
  .dock .row .btn{width:auto;flex:1;font-size:18px;}
  .dock .row .btn.go{flex:1.4;}

  /* ---------- Resumen ---------- */
  .sum{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px 0;}
  .sum .big{font-size:84px;line-height:1;}
  .sum h2{font-family:var(--display);font-weight:800;font-size:32px;margin:0;text-shadow:0 3px 0 rgba(0,0,0,.22);}
  .sum .pts{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;color:var(--sun);text-shadow:0 5px 0 rgba(0,0,0,.25);}
  .sum p{font-size:18px;margin:4px 0 14px;}
  .sum .btns{width:100%;max-width:340px;}

  .confetti{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:99;animation:fall 1.6s ease-in forwards;}
  @keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot));opacity:.9;}}

  /* ---------- Puntos, rachas y récords ---------- */
  .streak{
    font-family:var(--display);font-weight:800;font-size:15px;background:#FF7A2F;color:#fff;border-radius:999px;
    padding:3px 10px;white-space:nowrap;border-bottom:3px solid #D95F14;animation:pulse .5s ease;
  }
  @keyframes pulse{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .pointsline{margin-top:6px;text-align:center;font-family:var(--display);font-weight:800;font-size:17px;min-height:26px;text-shadow:0 2px 0 rgba(0,0,0,.22);}
  .pointsline.hot{color:var(--sun);font-size:19px;animation:pulse .5s ease;}
  .best{text-align:center;font-weight:800;font-size:15px;margin:10px 0 0;min-height:20px;text-shadow:0 2px 0 rgba(0,0,0,.2);}
  .row2{display:flex;gap:10px;}
  .row2 .btn{width:auto;flex:1;font-size:17px;}
  .chips.onbg{margin-bottom:14px;}
  .chips.onbg .chip{background:rgba(255,255,255,.22);color:#fff;border-bottom-color:var(--chunk);border-color:transparent;}
  .chips.onbg .chip.on{background:#fff;color:var(--ink);border-bottom-color:var(--chunk);}
  .score-row{
    display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:16px;border-bottom:5px solid var(--chunk);
    padding:9px 12px;margin-bottom:10px;
  }
  .score-row .pos{font-family:var(--display);font-weight:800;font-size:22px;width:38px;text-align:center;flex:none;}
  .score-row .who{flex:1;min-width:0;}
  .score-row .nm{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .score-row .det{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .score-row .pt{font-family:var(--display);font-weight:800;font-size:24px;color:var(--accent);flex:none;}
  .empty{text-align:center;font-size:17px;margin:30px 10px;}
  .rec{background:#fff;color:var(--ink);border-radius:18px;border-bottom:5px solid var(--chunk);padding:12px;margin:0 0 14px;width:100%;max-width:340px;}
  .rec p{margin:0 0 8px;font-size:16px;font-family:var(--display);font-weight:800;}
  .rec .nrow{display:flex;gap:8px;}
  .rec input{
    flex:1;min-width:0;font-family:var(--body);font-weight:800;font-size:18px;padding:10px 12px;border-radius:12px;
    border:3px solid #D9D7E3;color:var(--ink);
  }
  .rec .btn{width:auto;min-height:48px;font-size:16px;padding:6px 16px;}
  .sum .stats{font-size:15px;margin:0 0 6px;opacity:.95;}
  .btn.small{font-size:15px;min-height:44px;margin-top:14px;}

  @media (max-width:360px){
    .q{font-size:19px;}
    .item-card .nombre{font-size:16px;}
    .btn{font-size:17px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="icon-btn hidden" id="btnBack" aria-label="Volver">←</button>
    <span></span>
    <div class="right">
      <button class="icon-btn" id="btnSound" aria-pressed="true">🔊</button>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button data-lang="es">ES</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <!-- INICIO -->
  <section class="screen active" id="screenHome">
    <h1 class="logo">I-<em>SORT</em></h1>
    <p class="tagline" data-i18n="tagline"></p>

    <div class="panel">
      <h2 data-i18n="scopeTitle"></h2>
      <div class="scope-list" id="scopeList">
        <button class="scope-btn" data-scope="global">
          <span class="ico">🌎</span>
          <span class="txt"><span class="nm" data-i18n="scopeGlobal"></span><span class="sub" data-i18n="scopeGlobalSub"></span></span>
          <span class="cnt" id="cntGlobal"></span>
        </button>
        <button class="scope-btn" data-scope="local">
          <span class="ico">📍</span>
          <span class="txt"><span class="nm" data-i18n="scopeLocal"></span><span class="sub" data-i18n="scopeLocalSub"></span></span>
          <span class="cnt" id="cntLocal"></span>
        </button>
        <button class="scope-btn" data-scope="all">
          <span class="ico">🎲</span>
          <span class="txt"><span class="nm" data-i18n="scopeAll"></span><span class="sub" data-i18n="scopeAllSub"></span></span>
          <span class="cnt" id="cntAll"></span>
        </button>
      </div>

      <h2 data-i18n="lenTitle"></h2>
      <div class="chips" id="lenChips">
        <button class="chip" data-len="10">10</button>
        <button class="chip" data-len="20">20</button>
        <button class="chip" data-len="0" data-i18n="lenAll"></button>
      </div>
    </div>

    <button class="btn play" id="btnPlay" data-i18n="play"></button>
    <p class="best" id="bestLine"></p>
    <div class="row2" style="margin-top:12px">
      <button class="btn ghost" id="btnCatalog" style="margin-top:0">📚 <span data-i18n="catalog"></span></button>
      <button class="btn ghost" id="btnScores" style="margin-top:0">🏆 <span data-i18n="scoresBtn"></span></button>
    </div>
    <p class="foot" id="homeFoot"></p>
  </section>

  <!-- CATÁLOGO -->
  <section class="screen" id="screenCatalog">
    <h2 class="screen-title" data-i18n="catalogTitle"></h2>
    <div class="tabs" id="catTabs">
      <button data-tab="all" data-i18n="tabAll"></button>
      <button data-tab="global">🌎 Global</button>
      <button data-tab="local">📍 Local</button>
    </div>
    <div id="catList"></div>
  </section>

  <!-- RÉCORDS -->
  <section class="screen" id="screenScores">
    <h2 class="screen-title">🏆 <span data-i18n="scoresTitle"></span></h2>
    <div class="tabs" id="scoreTabs">
      <button data-tab="all" data-i18n="tabAll"></button>
      <button data-tab="global">🌎 Global</button>
      <button data-tab="local">📍 Local</button>
    </div>
    <div class="chips onbg" id="scoreLens">
      <button class="chip" data-len="10">10</button>
      <button class="chip" data-len="20">20</button>
      <button class="chip" data-len="0" data-i18n="lenAll"></button>
    </div>
    <div id="scoreList"></div>
    <button class="btn ghost small" id="btnClear"></button>
  </section>

  <!-- JUEGO -->
  <section class="screen" id="screenGame">
    <div class="hud">
      <span id="roundLabel"></span>
      <span class="track"><i id="fill"></i></span>
      <span class="streak hidden" id="streakTag"></span>
      <span class="score" id="scoreTally">⭐ 0</span>
    </div>

    <div class="qcard">
      <div class="tags">
        <span class="tag" id="tagScope"></span>
        <span class="tag cat" id="tagCat"></span>
        <span class="tag diff" id="tagDiff"></span>
      </div>
      <p class="q" id="qText"></p>
      <span class="dir" id="dirChip"></span>
      <p class="note" data-i18n="scoringNote"></p>
    </div>

    <ul id="cardList"></ul>
    <div class="banner" id="banner"></div>
    <div class="pointsline" id="pointsLine"></div>

    <div class="dock">
      <button class="btn peek hidden" id="btnPeek"></button>
      <div class="row">
        <button class="btn ghost" id="btnShuffle" style="margin-top:0"></button>
        <button class="btn go" id="btnConfirm"></button>
      </div>
    </div>
  </section>

  <!-- RESUMEN -->
  <section class="screen" id="screenSummary">
    <div class="sum">
      <div class="big" id="sumEmoji">🏆</div>
      <h2 data-i18n="sumTitle"></h2>
      <div class="pts" id="sumPts"></div>
      <p class="stats" id="sumStats"></p>
      <p id="sumMsg"></p>
      <div class="rec hidden" id="recBox">

/* =========================================================
   SONIDOS (sintetizados con Web Audio, sin archivos)
   ========================================================= */
let soundOn = store('sound') !== '0';
let actx = null;
function audio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{ actx = new AC(); }catch(e){ return null; }
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol, slideTo){
  const c = audio(); if(!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function playWin(){            // fanfarria ascendente (Do-Mi-Sol-Do agudo)
  if(!soundOn) return;
  [523.25, 659.25, 783.99].forEach((f,i) => tone(f, i*0.11, 0.18, 'triangle', 0.28));
  tone(1046.5, 0.36, 0.55, 'triangle', 0.3);
  tone(1318.5, 0.36, 0.55, 'sine', 0.12);
  tone(784, 0.36, 0.55, 'sine', 0.1);
}
function playFail(){           // "bwomp" descendente
  if(!soundOn) return;
  tone(220, 0, 0.22, 'sawtooth', 0.22, 180);
  tone(164.8, 0.2, 0.45, 'sawtooth', 0.22, 110);
}
function playStreak(level){    // "power-up": arpegio pentatónico brillante; más notas cuanto más larga la racha
  if(!soundOn) return;
  const notes = [784, 1046.5, 1318.5, 1568, 1760, 2093];
  const n = Math.min(3 + (level-2), notes.length);
  for(let i=0;i<n;i++) tone(notes[i], i*0.07, 0.16, 'square', 0.1);
  tone(notes[n-1]*1.5, n*0.07, 0.5, 'sine', 0.12);          // destello final
  tone(notes[n-1], n*0.07, 0.5, 'triangle', 0.14, notes[n-1]*1.06);
}
function renderSound(){
  const b = $('btnSound');
  b.textContent = soundOn ? '🔊' : '🔇';
  b.classList.toggle('off', !soundOn);
  b.setAttribute('aria-pressed', String(soundOn));
  const lbl = t(soundOn ? 'soundOn' : 'soundOff');
  b.setAttribute('aria-label', lbl); b.setAttribute('title', lbl);
}

  if(vars) for(const x in vars) s = s.replace('{'+x+'}', vars[x]);
  return s;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);
  let r=n>>16, g=(n>>8)&255, b=n&255;
  r=Math.round(r*(1-p)); g=Math.round(g*(1-p)); b=Math.round(b*(1-p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function setTheme(color){
  const s = document.body.style;

  $('metaTheme').setAttribute('content', color);

function correctOrder(r){
  const d = r.dir === 'desc' ? -1 : 1;
  return [...r.items].sort((a,b)=> d*(a.v-b.v)).map(i=>i.id);
}
function rankMap(r){ const m={}; correctOrder(r).forEach((id,i)=>{ m[id]=i; }); return m; }

/* =========================================================
   ARRASTRAR (mouse + touch, sin librerías)
   El nodo arrastrado solo se mueve con transform; el DOM y el
   array `order` se reordenan una vez, al soltar.
   ========================================================= */
let drag = null;
function onDown(e){
  if(confirmed) return;
  if(e.button !== undefined && e.button !== 0) return;
  const card = e.currentTarget;
  const cards = Array.from($('cardList').children);
  const startIndex = cards.indexOf(card);
  const slot = cards.length>1 ? cards[1].offsetTop - cards[0].offsetTop : card.offsetHeight + 10;
  drag = {card, cards, startIndex, currentIndex:startIndex, startY:e.clientY, slot, len:cards.length};
  card.setPointerCapture(e.pointerId);
  card.classList.add('dragging');
  card.addEventListener('pointermove', onMove);
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointercancel', onUp);
  e.preventDefault();
}
function onMove(e){
  if(!drag) return;
  const dy = e.clientY - drag.startY;
  drag.card.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
  let target = drag.startIndex + Math.round(dy / drag.slot);
  target = Math.max(0, Math.min(drag.len-1, target));
  if(target !== drag.currentIndex){ drag.currentIndex = target; slotPreview(); }
}
function slotPreview(){
  const {card, cards, startIndex, currentIndex, slot} = drag;
  cards.forEach((c,i) => {
    if(c===card) return;
    c.classList.add('settling');
    let shift = 0;
    if(startIndex < currentIndex && i > startIndex && i <= currentIndex) shift = -slot;
    else if(startIndex > currentIndex && i >= currentIndex && i < startIndex) shift = slot;
    c.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
  });
}
function onUp(e){
  if(!drag) return;
  const {card, cards, startIndex, currentIndex} = drag;
  try{ card.releasePointerCapture(e.pointerId); }catch(_){}
  card.removeEventListener('pointermove', onMove);
  card.removeEventListener('pointerup', onUp);
  card.removeEventListener('pointercancel', onUp);
  const [moved] = order.splice(startIndex,1);
  order.splice(currentIndex,0,moved);
  cards.forEach(c => { c.classList.remove('dragging','settling'); c.style.transform=''; });
  drag = null;
  renderCards(queue[qi]);
}

/* =========================================================
   VALIDACIÓN — orden RELATIVO (subsecuencia creciente más larga)
   Los elementos de esa cadena ya están bien ordenados entre sí;
   el resto es lo que hay que mover.
   ========================================================= */
function lis(values){
  const n = values.length;
  const dp = new Array(n).fill(1), prev = new Array(n).fill(-1);
  let best = 1, end = 0;
  for(let i=0;i<n;i++){
    for(let j=0;j<i;j++){
      if(values[j] < values[i] && dp[j]+1 > dp[i]){ dp[i]=dp[j]+1; prev[i]=j; }
    }
    if(dp[i] > best){ best = dp[i]; end = i; }
  }
  const idx = new Set();
  for(let k=end; k!==-1; k=prev[k]) idx.add(k);
  return {idx, length:best};
}
function confirmOrder(){
  if(confirmed) return;
  confirmed = true;
  const r = queue[qi];
  const rank = rankMap(r);
  const cards = Array.from($('cardList').children);
  const {idx, length:aciertos} = lis(cards.map(c => rank[c.dataset.id]));
  lastAciertos = aciertos;

  cards.forEach((c,i) => {
    const ok = idx.has(i);
    c.classList.add('locked', ok ? 'correct' : 'incorrect');
    c.querySelector('.valor').textContent = P(itemById(r, c.dataset.id).l);
    const g = c.querySelector('.grip');
    const m = document.createElement('span');
    m.className = 'mark'; m.textContent = ok ? '✓' : '✕';
    m.style.animationDelay = (i*70) + 'ms';
    g.replaceWith(m);
  });

  totalScore += aciertos;
  maxScore += r.items.length;
  // puntos: 10 por tarjeta bien ubicada + 20 por ronda perfecta + bonus por racha de rondas perfectas
  const perfect = aciertos === r.items.length;
  const prevStreak = streak;
  let bonus = 0;
  const base = aciertos*10 + (perfect ? 20 : 0);
  if(perfect){ streak++; bestStreak = Math.max(bestStreak, streak); if(streak >= 2) bonus = Math.min(streak-1, 5) * 15; }
  else streak = 0;
  points += base + bonus;
  roundInfo = {base, bonus, streak, lost: !perfect && prevStreak >= 2};
  $('scoreTally').textContent = '⭐ ' + points;
  renderStreakTag(true);
  renderPoints();
  $('fill').style.width = ((qi+1) / queue.length * 100) + '%';
  $('btnConfirm').textContent = qi < queue.length-1 ? t('next') : t('finish');
  $('btnShuffle').disabled = true;
  renderBanner();
  if(aciertos < r.items.length){ $('btnPeek').classList.remove('hidden'); playFail(); }
  else {
    burst(); playWin();
    if(bonus > 0){ const lv = streak; setTimeout(() => playStreak(lv), 520); }
  }
}
function nextOrConfirm(){
  if(!confirmed){ confirmOrder(); return; }
  endPeek();
  qi++;
  if(qi >= queue.length) showSummary();
  else loadRound();
}

/* =========================================================
   VER ORDEN CORRECTO (mantener presionado)
   ========================================================= */
function startPeek(){
  if(!confirmed || peeking) return;
  peeking = true;
  const r = queue[qi], rank = rankMap(r);
  const cards = Array.from($('cardList').children);
  const slot = cards.length>1 ? cards[1].offsetTop - cards[0].offsetTop : cards[0].offsetHeight + 10;
  cards.forEach((c,i) => {
    const k = rank[c.dataset.id];
    c.style.transform = 'translateY(' + ((k-i)*slot) + 'px)';
    c.classList.add('peeking');
    c.querySelector('.rank').textContent = k+1;
  });
  $('btnPeek').classList.add('holding');
  renderBanner();
}
function endPeek(){
  if(!peeking) return;
  peeking = false;
  const cards = Array.from($('cardList').children);
  cards.forEach((c,i) => {
    c.style.transform = '';
    c.classList.remove('peeking');
    c.querySelector('.rank').textContent = i+1;
  });
  $('btnPeek').classList.remove('holding');
  renderBanner();
}

function saveRecord(){
  if(recState.status === 'saved' || !qualifies(points, gameKey)) return;
  const name = ($('nameInput').value || '').trim().slice(0,14) || t('anon');
  store('name', name);
  const pct = maxScore ? Math.round(totalScore/maxScore*100) : 0;
  const rank = addScore({name, pts:points, acc:pct, streak:bestStreak, rounds:queue.length, date:Date.now()}, gameKey);
  recState = {status:'saved', rank};
  renderSummary();
}
function burst(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const em = ['🎉','⭐','✨','🎊','🌟'];
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    s.textContent = em[i % em.length];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.setProperty('--dx', (Math.random()*120-60) + 'px');
    s.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    s.style.animationDelay = (Math.random()*300) + 'ms';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 2200);
  }
}

  lang = b.dataset.lang; store('lang', lang); applyLang();
}));

}));

  lenSel = parseInt(b.dataset.len,10); store('len', String(lenSel)); renderHome();
}));
document.querySelectorAll('#catTabs button').forEach(b => b.addEventListener('click', () => {
  catTab = b.dataset.tab; renderCatalog();
}));
$('btnSound').addEventListener('click', () => {
  soundOn = !soundOn; store('sound', soundOn ? '1' : '0'); renderSound();
  if(soundOn) tone(880, 0, 0.12, 'triangle', 0.2);
});
$('btnPlay').addEventListener('click', startFromHome);
$('btnScores').addEventListener('click', goScores);
$('btnSave').addEventListener('click', saveRecord);
$('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') saveRecord(); });
document.querySelectorAll('#scoreTabs button').forEach(b => b.addEventListener('click', () => { scoreTab = b.dataset.tab; renderScores(); }));
document.querySelectorAll('#scoreLens .chip').forEach(b => b.addEventListener('click', () => { scoreLen = parseInt(b.dataset.len,10); renderScores(); }));

$('btnCatalog').addEventListener('click', goCatalog);
$('btnBack').addEventListener('click', () => {
  if(screen==='game' && returnTo==='catalog') goCatalog(); else goHome();
});
$('btnConfirm').addEventListener('click', nextOrConfirm);
$('btnShuffle').addEventListener('click', () => {
  if(confirmed) return;
  order = shuffle(order); renderCards(queue[qi]);
});
$('btnAgain').addEventListener('click', () => {
  if(returnTo==='catalog') startSession([queue[0]], 'catalog'); else startFromHome();
});
$('btnHome').addEventListener('click', () => { if(returnTo==='catalog') goCatalog(); else goHome(); });

const pk = $('btnPeek');
pk.addEventListener('pointerdown', e => { try{ pk.setPointerCapture(e.pointerId); }catch(_){} startPeek(); e.preventDefault(); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => pk.addEventListener(ev, endPeek));
pk.addEventListener('contextmenu', e => e.preventDefault());
pk.addEventListener('keydown', e => { if((e.key===' '||e.key==='Enter') && !e.repeat){ e.preventDefault(); startPeek(); } });
pk.addEventListener('keyup',   e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); endPeek(); } });
pk.addEventListener('blur', endPeek);

applyLang();
</script>
